# ISS analysis profile (XView) under pixi.
#
# Launch:   pixi run start              (from this directory)
#      or:  bsan --runtime-env=pixi --manifest-path=/path/to/profile_analysis/pixi.toml
#
# `bsan` expects an environment called `terminal` and a task called `start`.
[workspace]
channels = ["conda-forge"]
name = "profile_analysis"
platforms = ["linux-64"]
version = "2026.10.0"

[system-requirements]
libc = "2.17"

[feature.profile.dependencies]
python = ">=3.12,<3.14"
numpy = ">=2,<3"
pandas = ">=2,<3"
scipy = ">=1.14"
scikit-learn = ">=1.5"
matplotlib-base = ">=3.10"
lmfit = ">=1.3"
xraydb = ">=4.5"
# xraylarch-base: the larch library without its wxPython/PyQt5/Jupyter GUI stack
xraylarch-base = ">=2025.1"
larixite = "*"
periodictable = ">=1.7"
h5py = "*"
numexpr = "*"
xarray = "*"
xlsxwriter = "*"
tabulate = "*"
jsonschema = "*"
pytz = "*"
requests = "*"
# data access
tiled-client = ">=0.2.11,<0.2.19"  # databroker 2.0.1 imports tiled.queries.AccessBlobFilter, dropped in 0.2.19
databroker = ">=2.0.0b8,<3"
bluesky-tiled-plugins = "*"
bluesky = "*"
ophyd = "*"
pyepics = "*"
event-model = "*"
bluesky-widgets = "*"  # xview databroker tab
# GUI
pyqt6 = ">=6.7,<7"
qtpy = ">=2.4"
pyqtgraph = ">=0.13"
opencv = ">=4.10"
pillow = "*"
pyzbar = "*"
# cloud / messaging (isscloudtools)
dropbox = "*"
google-api-python-client = "*"
google-auth-httplib2 = "*"
google-auth-oauthlib = "*"
slackclient = "*"
historydict = "*"
# materials project / FEFF (xview xfit tab)
pymatgen = "*"
mp-api = "*"
# xview dash web app
dash = "*"
dash-bootstrap-components = "*"
plotly = "*"

[feature.profile.pypi-dependencies]
xview = { path = "../xview", editable = true }
xas = { path = "../xas", editable = true }
isstools = { path = "../isstools", editable = true }
isscloudtools = { path = "../isscloudtools", editable = true }
issfactortools = { path = "../issfactortools", editable = true }
pymcr = "*"
kkcalc = "*"  # xas.scattering

[feature.terminal.dependencies]
ipython = ">=9.0"

[feature.terminal.tasks]
start = "unset SESSION_MANAGER PYTHONPATH && QT_API=pyqt6 MPLBACKEND=qtagg ipython --profile-dir=$PIXI_PROJECT_ROOT"

[environments]
terminal = { features = ["profile", "terminal"], solve-group = "profile" }
